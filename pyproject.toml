[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxterm"
version = "0.1.0"
description = "A native Linux terminal and infrastructure workspace"
requires-python = ">=3.12"
dependencies = ["PyGObject", "cryptography"]

[project.scripts]
linuxterm = "linuxterm.app:main"

[tool.setuptools.packages.find]
where = ["src"]
